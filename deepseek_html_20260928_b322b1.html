<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>量化工作台 Pro · 精简版</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0d14;--card:#131826;--card2:#1a2033;--border:#252c42;--text:#e4e7ef;--text2:#a8b0c2;--muted:#6b7490;--up:#00d68f;--down:#ff4757;--accent:#4d7cfe;--gold:#ffb800;--purple:#a855f7;--safe:env(safe-area-inset-bottom,0px)}
html,body{overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5;min-height:100vh}
body{padding-bottom:calc(64px + var(--safe))}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(19,24,38,.96);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:8px;padding-top:calc(10px + env(safe-area-inset-top));flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;flex:1;min-width:0}
.logo .dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 10px var(--up);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status{display:flex;align-items:center;gap:6px;font-size:10px;flex-wrap:wrap}
.badge{padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(77,124,254,.15);color:var(--accent);border:1px solid rgba(77,124,254,.3)}
.badge.ok{background:rgba(0,214,143,.15);color:var(--up);border-color:rgba(0,214,143,.3)}
.badge.warn{background:rgba(255,184,0,.15);color:var(--gold);border-color:rgba(255,184,0,.3)}
.badge.err{background:rgba(255,71,87,.15);color:var(--down);border-color:rgba(255,71,87,.3)}
#sentBadge{padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;cursor:pointer}
#dataSrc{font-size:9px;color:var(--muted);font-family:ui-monospace,monospace}
main{padding:12px;max-width:1400px;margin:0 auto}
.tabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:10px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit;white-space:nowrap;flex-shrink:0}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(77,124,254,.45)}
.panel{display:none;animation:fd .2s}
.panel.active{display:block}
@keyframes fd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.card-title{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 calc(50% - 5px);min-width:0}
.field label{font-size:11px;color:var(--muted)}
.field input,.field select{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:9px;font-size:14px;outline:none;font-family:inherit;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,#4d7cfe,#3b6ae0);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-top:4px}
.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(135deg,#00d68f,#00b377)}
.btn.red{background:linear-gradient(135deg,#ff4757,#e63946)}
.btn.small{padding:8px 14px;font-size:12px;width:auto;margin:0}
.btn.ghost{background:var(--card2);border:1px solid var(--border);color:var(--text2)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.metric .l{font-size:11px;color:var(--muted);margin-bottom:6px}
.metric .v{font-size:20px;font-weight:800;line-height:1.1}
.metric .v.up{color:var(--up)}.metric .v.down{color:var(--down)}
.metric.mini .v{font-size:15px}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);background:var(--card);max-height:600px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
thead th{background:var(--card2);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:11px;position:sticky;top:0;z-index:2}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(37,44,66,.5)}
.up{color:var(--up)}.down{color:var(--down)}.pos{color:var(--up)}.neg{color:var(--down)}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;line-height:1.6}
.tag.buy{background:rgba(0,214,143,.15);color:var(--up)}
.tag.sell{background:rgba(255,71,87,.15);color:var(--down)}
.tag.warn{background:rgba(255,184,0,.15);color:var(--gold)}
.tag.info{background:rgba(77,124,254,.15);color:var(--accent)}
.tag.gold{background:rgba(255,184,0,.2);color:var(--gold)}
.tag.danger{background:rgba(239,68,68,.2);color:#ef4444;border:1px solid rgba(239,68,68,.4)}
.tag.hot{background:rgba(236,72,153,.2);color:#f472b6}
.score{display:inline-block;min-width:32px;padding:3px 8px;border-radius:6px;font-weight:800;font-size:12px;text-align:center}
.score.hi{background:rgba(0,214,143,.18);color:var(--up)}
.score.mid{background:rgba(77,124,254,.18);color:var(--accent)}
.score.gold{background:rgba(255,184,0,.25);color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;line-height:2}
.item-card{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:13px 14px;margin-bottom:10px;cursor:pointer;border-left:3px solid transparent}
.item-card.tier-s{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(255,184,0,.06),var(--card2))}
.item-card.tier-a{border-left-color:var(--accent)}
.item-card.tier-b{border-left-color:var(--up)}
.ic-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ic-code{font-weight:800;color:var(--accent);font-size:13px;flex-shrink:0}
.ic-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-price{margin-left:auto;font-weight:800;font-size:15px;flex-shrink:0}
.ic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;padding:10px;background:rgba(0,0,0,.2);border-radius:8px;font-size:11px}
.ic-grid .k{color:var(--muted);display:block;margin-bottom:2px;font-size:10px}
.ic-grid .v{font-weight:700;font-size:13px}
.ic-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.op-hint{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.op-hint.buy-strong{background:rgba(255,71,87,.2);color:#ff6b35}
.op-hint.buy{background:rgba(255,184,0,.2);color:var(--gold)}
.op-hint.hold{background:rgba(0,214,143,.15);color:var(--up)}
.op-hint.reduce{background:rgba(255,184,0,.2);color:var(--gold)}
.op-hint.avoid{background:rgba(255,71,87,.2);color:var(--down)}
.dec-tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(77,124,254,.2);color:var(--accent)}
.star{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;cursor:pointer;font-size:15px;color:#3a4258;user-select:none;margin-left:4px}
.star.on{color:var(--gold)}
#mnav{display:block;position:fixed;left:0;right:0;bottom:0;height:56px;background:rgba(19,24,38,.98);border-top:1px solid var(--border);z-index:200;padding-bottom:var(--safe)}
#mnav .nav{display:flex;height:56px}
#mnav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;cursor:pointer;border:none;background:none;font-family:inherit;padding:4px 2px;position:relative}
#mnav .nav-item .ic{font-size:20px;line-height:1}
#mnav .nav-item.on{color:var(--accent)}
#mnav .nav-item.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--accent);border-radius:0 0 4px 4px}
.drawer{position:fixed;inset:0;background:rgba(10,13,20,.98);z-index:300;padding:18px;overflow-y:auto;display:none;padding-top:calc(18px + env(safe-area-inset-top))}
.drawer.show{display:block}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:15px;font-weight:700}
.drawer-close{background:var(--card2);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:9px;font-size:20px;cursor:pointer}
.drawer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.drawer-item{padding:14px 8px;background:var(--card2);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;text-align:center}
.drawer-item .ic{font-size:22px}
.modal{position:fixed;inset:0;background:rgba(10,13,20,.85);z-index:4000;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:820px;max-height:94vh;overflow-y:auto;padding-bottom:var(--safe);animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;border-radius:18px 18px 0 0}
.modal-h h3{font-size:15px;font-weight:700;flex:1;min-width:0;margin-right:8px}
.modal-close{background:var(--card2);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:9px;font-size:20px;cursor:pointer}
.modal-body{padding:16px 18px}
.modal-tabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.modal-tabs::-webkit-scrollbar{display:none}
.modal-tab{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit;white-space:nowrap}
.modal-tab.active{background:var(--accent);color:#fff}
.mi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:var(--card2);border-radius:10px;margin-bottom:14px}
.mi-item .k{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}
.mi-item .v{font-size:14px;font-weight:700}
.action-card{padding:18px;border-radius:12px;text-align:center;margin-bottom:14px;border:2px solid}
.action-card.add{background:rgba(255,71,87,.12);border-color:rgba(255,71,87,.5)}
.action-card.hold{background:rgba(0,214,143,.12);border-color:rgba(0,214,143,.5)}
.action-card.reduce{background:rgba(255,184,0,.12);border-color:rgba(255,184,0,.5)}
.action-card.sell{background:rgba(255,71,87,.18);border-color:rgba(255,71,87,.6)}
.action-card.empty{background:rgba(107,116,144,.15);border-color:rgba(107,116,144,.4)}
.action-card .act{font-size:28px;font-weight:900;margin-bottom:6px}
.action-card.add .act{color:#ff6b35}.action-card.hold .act{color:var(--up)}.action-card.reduce .act{color:var(--gold)}.action-card.sell .act{color:var(--down)}.action-card.empty .act{color:var(--muted)}
.action-card .rule{font-size:12px;color:var(--text2);font-family:ui-monospace,monospace}
.section{margin-bottom:14px}
.section-t{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--border);display:flex;align-items:center;gap:6px}
.reasons{background:var(--card2);border-radius:8px;padding:10px 12px}
.reasons .r{font-size:12px;color:var(--text2);line-height:1.9;display:flex;gap:6px}
.op-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.op-item .k{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}
.op-item .v{font-size:13px;font-weight:700}
.copy-bar{display:flex;gap:6px;padding:12px 18px;flex-wrap:wrap;border-top:1px solid rgba(0,214,143,.2);background:rgba(0,214,143,.04);padding-bottom:calc(12px + var(--safe))}
.copy-btn{flex:1;min-width:0;padding:10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text2)}
.copy-btn.primary{background:linear-gradient(135deg,#00d68f,#00b377);color:#fff;border-color:#00d68f}
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(19,24,38,.98);border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-size:12px;opacity:0;pointer-events:none;transition:all .3s;z-index:5000;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(0,214,143,.5);color:#86efac}
#toast.err{border-color:rgba(255,71,87,.5);color:#fca5a5}
.copy-tip{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,214,143,.96);color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:5000;pointer-events:none;opacity:0;transition:all .3s}
.copy-tip.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dim-row{margin-bottom:10px}
.dim-row .hd{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.dim-row .bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.dim-row .bar-in{height:100%;border-radius:2px}
.sector-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;margin:4px;font-size:12px}
.chart-box{width:100%;height:240px}
.chart-box.sm{height:180px}
.chart-box.lg{height:300px}
.idx-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.idx-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
.idx-card .n{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx-card .p{font-size:15px;font-weight:800;margin:2px 0;line-height:1.2}
.idx-card .c{font-size:11px;font-weight:700}
.rank-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(37,44,66,.4);font-size:12px}
.rank-row:last-child{border-bottom:none}
.rank-no{width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;font-size:10px;font-weight:800;background:var(--card2);color:var(--muted);flex-shrink:0}
.rank-no.top1{background:rgba(255,184,0,.25);color:var(--gold)}
.rank-no.top2{background:rgba(168,85,247,.25);color:#c084fc}
.rank-no.top3{background:rgba(77,124,254,.25);color:var(--accent)}
.rank-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-val{font-weight:700;flex-shrink:0}
.bar-mini{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.bar-mini i{display:block;height:100%;border-radius:3px}
.pill{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;background:var(--card2);border:1px solid var(--border);color:var(--text2);margin:2px 3px 2px 0}
.trade-plan{background:rgba(0,0,0,.25);border-radius:8px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:11px}
.tp-row{display:flex;justify-content:space-between;align-items:center;line-height:1.6;gap:6px}
.tp-label{color:var(--muted);font-size:10px;flex-shrink:0}
.tp-val{font-weight:700;font-size:12px;text-align:right}
.action-hint{display:block;text-align:center;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:800;margin:8px 0;letter-spacing:.5px}
.action-hint.buy-strong{background:linear-gradient(135deg,rgba(255,71,87,.25),rgba(255,140,66,.15));color:#ff6b35;border:1px solid rgba(255,71,87,.4)}
.action-hint.buy{background:rgba(255,184,0,.18);color:var(--gold);border:1px solid rgba(255,184,0,.4)}
.action-hint.hold{background:rgba(0,214,143,.15);color:var(--up);border:1px solid rgba(0,214,143,.35)}
.action-hint.reduce{background:rgba(255,184,0,.15);color:var(--gold);border:1px solid rgba(255,184,0,.35)}
.action-hint.sell{background:rgba(255,71,87,.2);color:var(--down);border:1px solid rgba(255,71,87,.4)}
.action-hint.avoid{background:rgba(107,116,144,.2);color:var(--muted);border:1px solid rgba(107,116,144,.4)}
.plan-detail{background:var(--card2);border-radius:10px;padding:12px 14px;margin-bottom:12px;border-left:3px solid var(--accent)}
.plan-detail .row-line{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed rgba(37,44,66,.5);gap:8px}
.plan-detail .row-line:last-child{border-bottom:none}
.plan-detail .row-line .k{color:var(--muted);font-size:11px;flex-shrink:0}
.plan-detail .row-line .v{font-weight:700;text-align:right}
.strategy-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.strategy-pill{padding:6px 12px;border-radius:16px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.strategy-pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.auto-refresh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);cursor:pointer}
@media (min-width:769px){
  body{padding-bottom:20px}#mnav{display:none}
  .tabs{flex-wrap:wrap;overflow:visible}
  .field{flex:0 0 auto}.field input,.field select{width:150px}.btn{width:auto}
  .metrics{grid-template-columns:repeat(5,1fr)}
  .modal{align-items:center;padding:20px}.modal-box{border-radius:16px;max-height:90vh}
  .modal-h{border-radius:16px 16px 0 0}
  main{padding:20px 24px}header{padding:14px 24px}
  .copy-bar{padding-bottom:12px}.ic-grid{grid-template-columns:repeat(6,1fr)}
  .idx-row{grid-template-columns:repeat(6,1fr)}.mi-grid{grid-template-columns:repeat(6,1fr)}
}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span><span>量化工作台 Pro · 精简版</span></div>
  <div class="status">
    <span id="sentBadge" class="badge">🌡️ 加载中</span>
    <span id="dataBadge" class="badge ok">就绪</span>
    <span id="dataSrc">—</span>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(0,214,143,.15);color:#4ade80;border:1px solid rgba(0,214,143,.4)">
      <input type="checkbox" id="highWinToggle" checked style="cursor:pointer;accent-color:#00d68f">🎯 高胜率
    </label>
  </div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</main>
<nav id="mnav">
  <div class="nav">
    <button class="nav-item on" data-nav="sentiment"><span class="ic">🌡️</span>情绪</button>
    <button class="nav-item" data-nav="limitup"><span class="ic">🚀</span>涨停</button>
    <button class="nav-item" data-nav="watch"><span class="ic">⭐</span>自选</button>
    <button class="nav-item" data-nav="scan"><span class="ic">🔍</span>选股</button>
    <button class="nav-item" id="moreBtn"><span class="ic">☰</span>更多</button>
  </div>

let _jsonpSeq=0;
function jsonp(url,cbParam='cb',timeout=8000){
  return new Promise((resolve,reject)=>{
    const cbName='__jsonp_'+(++_jsonpSeq)+'_'+Date.now().toString(36);
    const s=document.createElement('script');let done=false;
    window[cbName]=(data)=>{if(!done){done=true;cleanup();resolve(data);}};
    const timer=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error('超时'));}},timeout);
    function cleanup(){clearTimeout(timer);try{delete window[cbName];}catch(e){window[cbName]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
    s.onerror=()=>{if(!done){done=true;cleanup();reject(new Error('加载失败'));}};
    const sep=url.includes('?')?'&':'?';
    s.src=url+sep+cbParam+'='+cbName;
    document.head.appendChild(s);
  });
}
function loadScript(url,charset,timeout=7000){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');if(charset)s.charset=charset;s.async=true;let done=false;
    const timer=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error('超时'));}},timeout);
    function cleanup(){clearTimeout(timer);if(s.parentNode)s.parentNode.removeChild(s);}
    s.onload=()=>{if(!done){done=true;cleanup();resolve();}};
    s.onerror=()=>{if(!done){done=true;cleanup();reject(new Error('加载失败'));}};
    s.src=url;document.head.appendChild(s);
  });
}
const PROXIES=[u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`];
async function fetchRaw(url,timeout=8000,type='json'){const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);if(type==='json'){const txt=await r.text();return JSON.parse(txt);}return await r.text();}catch(e){clearTimeout(t);throw e;}}
async function fetchWithProxy(url,timeout=8000,type='json'){try{return await fetchRaw(url,timeout,type);}catch(e){}for(const p of PROXIES){try{const r=await fetchRaw(p(url),timeout+2000,type);if(r)return r;}catch(e){}}throw new Error('代理失败');}

function mockKline(code,count){let seed=0;for(const c of code)seed=(seed*31+c.charCodeAt(0))%100000;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};let price=20+rnd()*80;const out=[];const d=new Date();d.setDate(d.getDate()-Math.floor(count*1.45));while(out.length<count){d.setDate(d.getDate()+1);const wd=d.getDay();if(wd===0||wd===6)continue;const drift=(rnd()-0.478)*0.03;const open=price;const close=Math.max(1,open*(1+drift));const high=Math.max(open,close)*(1+rnd()*0.012);const low=Math.min(open,close)*(1-rnd()*0.012);out.push({time:d.toISOString().slice(0,10),open:+open.toFixed(2),close:+close.toFixed(2),high:+high.toFixed(2),low:+low.toFixed(2),volume:Math.round(800000+rnd()*5000000),amount:Math.round(1e7+rnd()*5e7),turnover:+(1+rnd()*5).toFixed(2)});price=close;}return out;}

/* ============ 技术指标 ============ */
function rsi(a,p){const o=new Array(a.length).fill(NaN);if(a.length<=p)return o;let g=0,l=0;for(let i=1;i<=p;i++){const d=a[i]-a[i-1];if(d>0)g+=d;else l-=d;}let ag=g/p,al=l/p;o[p]=al===0?100:100-100/(1+ag/al);for(let i=p+1;i<a.length;i++){const d=a[i]-a[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;o[i]=al===0?100:100-100/(1+ag/al);}return o;}
function ema(arr,p){const o=[];const k=2/(p+1);let prev=arr[0];o.push(prev);for(let i=1;i<arr.length;i++){prev=arr[i]*k+prev*(1-k);o.push(prev);}return o;}
function macdCalc(close){const e12=ema(close,12),e26=ema(close,26);const dif=[];for(let i=0;i<close.length;i++)dif.push(e12[i]-e26[i]);const dea=ema(dif,9);const bar=[];for(let i=0;i<close.length;i++)bar.push((dif[i]-dea[i])*2);return{dif,dea,bar};}
function kdjCalc(bars,p=9){const K=[],D=[],J=[];let k=50,d=50;for(let i=0;i<bars.length;i++){if(i<p-1){K.push(50);D.push(50);J.push(50);continue;}let hh=-Infinity,ll=Infinity;for(let j=i-p+1;j<=i;j++){if(bars[j].high>hh)hh=bars[j].high;if(bars[j].low<ll)ll=bars[j].low;}const rsv=hh===ll?50:(bars[i].close-ll)/(hh-ll)*100;k=2/3*k+1/3*rsv;d=2/3*d+1/3*k;j=3*k-2*d;K.push(k);D.push(d);J.push(j);}return{K,D,J};}
function bollCalc(close,p=20){const mid=[],up=[],dn=[];for(let i=0;i<close.length;i++){if(i<p-1){mid.push(NaN);up.push(NaN);dn.push(NaN);continue;}const seg=close.slice(i-p+1,i+1);const m=seg.reduce((a,b)=>a+b,0)/p;const v=Math.sqrt(seg.reduce((s,x)=>s+(x-m)*(x-m),0)/p);mid.push(m);up.push(m+2*v);dn.push(m-2*v);}return{mid,up,dn};}
function atr(bars,p=14){if(!bars||bars.length<p+1)return 0;let s=0;for(let i=bars.length-p;i<bars.length;i++){const pc=bars[i-1]?bars[i-1].close:bars[i].close;s+=Math.max(bars[i].high-bars[i].low,Math.abs(bars[i].high-pc),Math.abs(bars[i].low-pc));}return s/p;}
function deepMetrics(bars){const n=bars.length;if(n<25)return null;const last=bars[n-1],prev=bars[n-2];const close=bars.map(b=>b.close),vols=bars.map(b=>b.volume);const chg=prev.close>0?((last.close-prev.close)/prev.close)*100:0;const avg5=vols.slice(n-6,n-1).reduce((a,b)=>a+b,0)/5;const volRatio=avg5>0?last.volume/avg5:0;const ma5=close.slice(-5).reduce((a,b)=>a+b,0)/5,ma10=close.slice(-10).reduce((a,b)=>a+b,0)/10,ma20=close.slice(-20).reduce((a,b)=>a+b,0)/20;const maBull=ma5>ma10&&ma10>ma20;let h20=-Infinity;for(let i=Math.max(0,n-21);i<n-1;i++)if(bars[i].high>h20)h20=bars[i].high;const breakOut20=h20>0&&last.close>h20;const range=last.high-last.low;const closePos=range>0?(last.close-last.low)/range:0.5;const rA=rsi(close,14);const rsiV=rA[n-1];let hasLimit=false;for(let i=n-1;i>=Math.max(1,n-20);i--){const c=(bars[i].close-bars[i-1].close)/bars[i-1].close*100;if(c>9.5){hasLimit=true;break;}}const pullback20=h20>0?((h20-last.close)/h20)*100:0;const md=macdCalc(close);const kd=kdjCalc(bars);const bl=bollCalc(close);return{last,chg,volRatio,ma5,ma10,ma20,maBull,aboveMa5:last.close>ma5,aboveMa20:last.close>ma20,breakOut20,closePos,rsiV,hasLimit,pullback20,high20:h20,turnover:last.turnover||5,macd:{dif:md.dif[n-1],dea:md.dea[n-1],bar:md.bar[n-1]},kdj:{k:kd.K[n-1],d:kd.D[n-1],j:kd.J[n-1]},boll:{up:bl.up[n-1],mid:bl.mid[n-1],dn:bl.dn[n-1]}};}
function techScore(m){let s=0;const v=m.volRatio;if(v>=2&&v<=3.5)s+=22;else if(v>3.5&&v<=5)s+=18;else if(v>=1.5&&v<2)s+=16;else if(v>5&&v<=8)s+=12;else if(v>=1&&v<1.5)s+=8;const c=m.chg;if(c>=3&&c<=6)s+=22;else if(c>6&&c<=9)s+=18;else if(c>=2&&c<3)s+=15;else if(c>=1&&c<2)s+=10;else if(c>=0&&c<1)s+=5;if(m.maBull&&m.aboveMa5)s+=18;else if(m.aboveMa5)s+=9;if(m.breakOut20)s+=12;if(m.closePos>=0.85)s+=10;else if(m.closePos>=0.7)s+=6;else if(m.closePos<0.3)s-=5;if(m.hasLimit)s+=8;if(m.pullback20>=15&&m.pullback20<=30)s+=8;if(m.rsiV<30)s+=6;else if(m.rsiV>75)s-=6;return{score:Math.max(0,Math.min(120,Math.round(s)))};}

/* ============ 交易计划 ============ */
function calcTradePlan(stock, sent, m, a){
  if(!m) return null;
  const price = stock.price || m.last.close;
  const chg = stock.chg !== undefined ? stock.chg : m.chg;
  const rsi = stock.rsi !== undefined ? stock.rsi : m.rsiV;
  const ma5 = m.ma5, ma10 = m.ma10, ma20 = m.ma20;
  const maBull = m.maBull, breakOut20 = m.breakOut20;
  const atrVal = a > 0 ? a : price * 0.03;
  const high20 = m.high20 || price * 1.1;
  let buyLow, buyHigh, entryRule;
  if (chg >= 9.5) {buyLow = +(price * 0.97).toFixed(2);buyHigh = +(price * 1.02).toFixed(2);entryRule = '次日竞价不高于+3%可建仓，或回踩5日线低吸';}
  else if (chg >= 5) {buyLow = +(Math.max(ma5, price * 0.97)).toFixed(2);buyHigh = +(price * 1.01).toFixed(2);entryRule = '当前价附近小仓建仓，回踩5日线补仓';}
  else if (chg >= 2) {buyLow = +(Math.max(ma5 * 0.99, ma10)).toFixed(2);buyHigh = +(price * 1.005).toFixed(2);entryRule = '回踩5日/10日线附近分批建仓';}
  else if (chg >= -2) {buyLow = +(Math.max(ma10, ma20)).toFixed(2);buyHigh = +(price * 1.005).toFixed(2);entryRule = '10日/20日线支撑位低吸';}
  else {buyLow = +(Math.max(ma20 * 0.98, price * 0.95)).toFixed(2);buyHigh = +(price * 1.01).toFixed(2);entryRule = '等待企稳，不急于建仓，破位放弃';}
  const stopByMa = ma5 > 0 ? ma5 * 0.97 : price * 0.93;
  const stopByAtr = price - 2 * atrVal;
  const stop = +Math.max(stopByMa, stopByAtr, price * 0.92).toFixed(2);
  const riskPct = +((price - stop) / price * 100).toFixed(2);
  const stopRule = stopByAtr > stopByMa ? '跌破2倍ATR止损' : '跌破5日线止损';
  const t1ByAtr = price + 2 * atrVal;
  const t2ByAtr = price + 4 * atrVal;
  const bollUp = (m.boll && m.boll.up > 0) ? m.boll.up : t2ByAtr * 1.05;
  const t1Final = +Math.min(t1ByAtr, high20).toFixed(2);
  const t2Final = +Math.max(t2ByAtr, bollUp).toFixed(2);
  const rewardPct1 = +((t1Final - price) / price * 100).toFixed(2);
  const rewardPct2 = +((t2Final - price) / price * 100).toFixed(2);
  const rr = riskPct > 0 ? +(rewardPct1 / riskPct).toFixed(2) : 0;
  let posNum = 1;
  if (sent.score >= 60) posNum = 0.5;
  else if (sent.score < 20) posNum = 1;
  else if (sent.score >= 40 && sent.score < 60) {if (rr >= 3 && rsi < 60) posNum = 3;else if (rr >= 2.5) posNum = 2;else posNum = 1.5;}
  else {if (rr >= 3) posNum = 2;else if (rr >= 2.5) posNum = 1.5;else posNum = 1;}
  if (breakOut20 && maBull) posNum = Math.min(posNum + 0.5, 3);
  if (!maBull && chg > 5) posNum = Math.max(posNum - 0.5, 0.5);
  const position = posNum + '成';
  let action, actionCls;
  if (sent.phase === '退潮期' || sent.score >= 80) {action = '🚫 空仓观望';actionCls = 'avoid';}
  else if (chg >= 9.5) {action = '🎯 次日打板/低吸';actionCls = 'buy-strong';}
  else if (breakOut20 && maBull && rr >= 2.5) {action = '🔥 重点建仓';actionCls = 'buy-strong';}
  else if (maBull && rr >= 2) {action = '✅ 分批建仓';actionCls = 'buy';}
  else if (chg > 5) {action = '⚠️ 冲高减仓';actionCls = 'reduce';}
  else if (!maBull && chg < -3) {action = '🚫 止损离场';actionCls = 'sell';}
  else {action = '👀 观察等待';actionCls = 'hold';}
  let addRule = '—';
  if (actionCls.includes('buy')) addRule = `突破 ${(price * 1.03).toFixed(2)} 加仓，回调 ${(price * 0.97).toFixed(2)} 补仓`;
  return {buyLow, buyHigh, entryRule, stop, stopRule, riskPct, t1: t1Final, t2: t2Final, rewardPct1, rewardPct2, rr, position, action, actionCls, addRule};
}

let _highWinMode=true;
function isHighWinMode(){return _highWinMode;}
function highWinScore(stock, sent, base, opts) {
  opts = opts || {};
  const mc = opts.marketChg || 0;
  const si = opts.sectorInfo || null;
  const a = opts.atr || 0;
  if (sent.score >= 80) return { pass: false };
  if (sent.score < 35) return { pass: false };
  if (sent.phase === '退潮期') return { pass: false };
  if (mc <= -0.5 || mc >= 1.2) return { pass: false };
  if (!si) return { pass: false };
  if (si.ztCount < 3) return { pass: false };
  if (stock.rsi !== undefined && (stock.rsi < 35 || stock.rsi > 70)) return { pass: false };
  if (stock.turnover !== undefined && (stock.turnover < 2 || stock.turnover > 15)) return { pass: false };
  let rrVal = 0;
  if (a > 0 && stock.price > 0) {const stop = Math.max(stock.price * 0.92, stock.price - 2 * a);const target = stock.price + 4 * a;rrVal = (target - stock.price) / (stock.price - stop);if (rrVal < 2.5) return { pass: false };}
  let b1 = 0;
  if (sent.score >= 40 && sent.score <= 60 && mc >= -0.3 && mc <= 1.2) b1 = 22;
  else if (sent.score >= 35 && sent.score <= 65) b1 = 12;
  let b2 = 0;
  if (si.ztCount >= 8) b2 = 30; else if (si.ztCount >= 5) b2 = 25; else if (si.ztCount >= 3) b2 = 18;
  let sc = base + b1 + b2;
  if (stock.maBull) sc += 12;
  if (stock.breakOut20) sc += 12;
  if (stock.closePos >= 0.8) sc += 6;
  if (stock.volRatio >= 1.5 && stock.volRatio <= 4) sc += 8;
  const final = Math.max(0, Math.min(120, Math.round(sc)));
  let tier = final >= 90 ? 's' : final >= 75 ? 'a' : final >= 60 ? 'b' : 'c';
  if (tier === 'b' || tier === 'c') return { pass: false };
  return { pass: true, score: final, tier, rr: +rrVal.toFixed(2) };
}

let _sentC=null,_sentT=0;
async function getSentiment(force){
  if(!force&&_sentC&&Date.now()-_sentT<300000)return _sentC;
  const r={score:50,phase:'中性',detail:{a:10,b:10,c:10,d:10,e:5,f:5},advice:'正常操作',zt:0,zb:0,dt:0,maxLian:0,sealRate:50,hotSectors:[],time:new Date().toLocaleString('zh-CN')};
  try{
    const ds=getPrevTradeDate();
    const[ztPool,zbPool,dtPool]=await Promise.all([getZTPool(ds),getZBPool(ds),getDTPool(ds)]);
    r.zt=ztPool.length;r.zb=zbPool.length;r.dt=dtPool.length;
    r.maxLian=ztPool.reduce((mx,z)=>Math.max(mx,z.lian),0);
    r.sealRate=(r.zt+r.zb)>0?(r.zt/(r.zt+r.zb)*100):50;
    r.lianCnt=ztPool.filter(z=>z.lian>=2).length;
    r.firstBoard=ztPool.filter(z=>z.lian<=1).length;
    r.promoteRate=r.zt>0?(r.lianCnt/r.zt*100):0;
    let s1=r.zt>=80?25:r.zt>=60?22:r.zt>=40?18:r.zt>=25?14:r.zt>=15?10:5;if(r.maxLian>=7)s1+=3;else if(r.maxLian>=5)s1+=2;s1=Math.min(28,s1);
    const up=r.zt>0?(r.lianCnt/r.zt*100):0;
    let s2=up>=40?20:up>=30?16:up>=20?12:up>=10?8:4;
    const zbl=r.zb/Math.max(1,r.zt+r.zb)*100;
    let s3=zbl<=15?15:zbl<=20?12:zbl<=25?9:zbl<=35?6:2;
    let s4=r.dt>=10?2:r.dt>=5?6:zbl<=10?15:zbl<=15?12:zbl<=25?8:zbl<=35?4:1;
    const secCnt={};for(const z of ztPool)if(z.sector)secCnt[z.sector]=(secCnt[z.sector]||0)+1;
    const sorted=Object.entries(secCnt).sort((a,b)=>b[1]-a[1]);
    r.hotSectors=sorted.slice(0,6).map(([n,c])=>({name:n,cnt:c}));
    const conc=r.zt>0?(sorted[0]?sorted[0][1]:0)/r.zt:0;
    let s5=conc>=0.4?15:conc>=0.3?12:conc>=0.2?9:conc>=0.1?5:2;
    let s6=r.zt>75?10:r.zt>60?8:r.zt>40?6:r.zt>25?4:2;
    r.score=Math.round(s1+s2+s3+s4+s5+s6);r.detail={a:s1,b:s2,c:s3,d:s4,e:s5,f:s6};
    if(r.score>=80){r.phase='退潮期';r.advice='空仓观望';}
    else if(r.score>=60){r.phase='高潮期';r.advice='减仓锁定';}
    else if(r.score>=40){r.phase='发酵期';r.advice='正常仓位';}
    else if(r.score>=20){r.phase='修复期';r.advice='精选参与';}
    else{r.phase='冰点期';r.advice='轻仓试错';}
    _sentC=r;_sentT=Date.now();updateSentBadge(r);return r;
  }catch(e){r.phase='数据异常';r.advice='接口受限';updateSentBadge(r);return r;}
}

async function doWencai(){
  const t=$('wc-input').value.trim();
  if(!t){toast('请输入条件','err');return;}
  const res=$('scanRes');
  res.innerHTML='<div class="card"><div class="empty">智能解析中…</div></div>';
  const minChgM = t.match(/涨幅[大于超过高于]\s*([\d.]+)/);
  const maxChgM = t.match(/涨幅[小于低于]\s*([\d.]+)/);
  const minVRM  = t.match(/量比[大于超过高于]\s*([\d.]+)/);
  const minTovM = t.match(/换手[大于超过高于]\s*([\d.]+)/);
  const needMa20 = /站上20日|大于20日/.test(t);
  const needMaBull = /多头排列/.test(t);
  const needBreak = /突破20日|突破新高/.test(t);
  const needMACD = /MACD金叉|金叉/i.test(t);
  const needKDJ = /KDJ超卖/.test(t);
  const needFund = /主力净流入|资金流入/.test(t);
  const minChg = minChgM ? +minChgM[1] : 0;
  const maxChg = maxChgM ? +maxChgM[1] : 999;
  const minVR  = minVRM  ? +minVRM[1]  : 0;
  const minTov = minTovM ? +minTovM[1] : 0;
  const conds = [];
  if(minChg) conds.push(`涨幅≥${minChg}%`);
  if(maxChgM) conds.push(`涨幅≤${maxChg}%`);
  if(minVR) conds.push(`量比≥${minVR}`);
  if(minTov) conds.push(`换手≥${minTov}%`);
  if(needMa20) conds.push('站上20日线');
  if(needMaBull) conds.push('多头排列');
  if(needBreak) conds.push('突破20日');
  if(needMACD) conds.push('MACD金叉');
  if(needKDJ) conds.push('KDJ超卖');
  if(needFund) conds.push('主力净流入');
  const hits=[];
  for(const code of POOL.active){
    try{
      const{bars}=await getKline(code,90);
      if(bars.length<30)continue;
      const mm=deepMetrics(bars);
      if(!mm)continue;
      if(mm.chg < minChg || mm.chg > maxChg) continue;
      if(mm.volRatio < minVR) continue;
      if(mm.turnover < minTov) continue;
      if(needMa20 && mm.last.close < mm.ma20) continue;
      if(needMaBull && !mm.maBull) continue;
      if(needBreak && !mm.breakOut20) continue;
      if(needMACD && !(mm.macd.dif > mm.macd.dea)) continue;
      if(needKDJ && !(mm.kdj.j < 20)) continue;
      if(needFund){const ff=await getStockFundFlow(code).catch(()=>null);if(!ff || ff.mainNet <= 0) continue;}
      hits.push({code:code.toUpperCase(),codeFull:code,name:NAMES[code]||'—',price:mm.last.close,chg:mm.chg,volRatio:mm.volRatio,rsi:mm.rsiV,turnover:mm.turnover,maBull:mm.maBull,breakOut20:mm.breakOut20,macd:mm.macd,kdj:mm.kdj,m:mm,a:atr(bars,14)});
    }catch(e){}
    await sleep(40);
  }
  if(!hits.length){res.innerHTML=`<div class="card"><div class="empty">无匹配<br><span style="font-size:11px">识别条件：${conds.join(' / ')||'无'}</span></div></div>`;return;}
  hits.sort((a,b)=>b.chg-a.chg);
  const sent = await getSentiment();
  res.innerHTML=`<div class="card"><div class="card-title"><span>🧠 结果 · ${hits.length} 只</span></div><div style="font-size:11px;color:var(--muted);line-height:1.7"><b style="color:var(--text2)">识别条件：</b>${conds.length?conds.join(' · '):'无'}</div></div>
${hits.slice(0,40).map(r=>renderStockCard(r,sent)).join('')}`;
  bindStockCards(res);
}

function renderKlineChart(elId, bars, m){
  if(!bars||bars.length<2)return;
  const last=Math.min(bars.length,80);
  const b=bars.slice(-last);
  const dates=b.map(x=>x.time.slice(5));
  const kdata=b.map(x=>[x.open,x.close,x.low,x.high]);
  const close=b.map(x=>x.close);
  const ma=(p)=>{const o=[];for(let i=0;i<close.length;i++){if(i<p-1){o.push('-');continue;}let s=0;for(let j=i-p+1;j<=i;j++)s+=close[j];o.push(+(s/p).toFixed(2));}return o;};
  initChart(elId,{backgroundColor:'transparent',tooltip:{trigger:'axis',axisPointer:{type:'cross'}},legend:{data:['K线','MA5','MA10','MA20'],textStyle:{color:CH.text,fontSize:10},top:0},grid:{left:40,right:14,top:28,bottom:24,containLabel:true},xAxis:{type:'category',data:dates,...baseAxis},yAxis:{type:'value',scale:true,...baseAxis,...baseSplit},series:[{name:'K线',type:'candlestick',data:kdata,itemStyle:{color:CH.up,color0:CH.down,borderColor:CH.up,borderColor0:CH.down}},{name:'MA5',type:'line',data:ma(5),smooth:true,symbol:'none',lineStyle:{width:1,color:'#ffb800'}},{name:'MA10',type:'line',data:ma(10),smooth:true,symbol:'none',lineStyle:{width:1,color:'#4d7cfe'}},{name:'MA20',type:'line',data:ma(20),smooth:true,symbol:'none',lineStyle:{width:1,color:'#a855f7'}}]});
}
function renderMacdChart(elId, bars){
  const close=bars.map(x=>x.close);
  const md=macdCalc(close);
  const last=Math.min(bars.length,80);
  const dates=bars.slice(-last).map(x=>x.time.slice(5));
  initChart(elId,{backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{data:['DIF','DEA','MACD'],textStyle:{color:CH.text,fontSize:10},top:0},grid:{left:40,right:14,top:28,bottom:24,containLabel:true},xAxis:{type:'category',data:dates,...baseAxis},yAxis:{type:'value',...baseAxis,...baseSplit},series:[{name:'DIF',type:'line',data:md.dif.slice(-last),symbol:'none',lineStyle:{width:1.5,color:'#4d7cfe'}},{name:'DEA',type:'line',data:md.dea.slice(-last),symbol:'none',lineStyle:{width:1.5,color:'#ffb800'}},{name:'MACD',type:'bar',data:md.bar.slice(-last).map(v=>({value:+v.toFixed(3),itemStyle:{color:v>=0?CH.up:CH.down}}))}]});
}
function renderKdjChart(elId, bars){
  const kd=kdjCalc(bars,9);
  const last=Math.min(bars.length,80);
  const dates=bars.slice(-last).map(x=>x.time.slice(5));
  initChart(elId,{backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{data:['K','D','J'],textStyle:{color:CH.text,fontSize:10},top:0},grid:{left:40,right:14,top:28,bottom:24,containLabel:true},xAxis:{type:'category',data:dates,...baseAxis},yAxis:{type:'value',...baseAxis,...baseSplit},series:[{name:'K',type:'line',data:kd.K.slice(-last),symbol:'none',lineStyle:{width:1.5,color:'#00d68f'}},{name:'D',type:'line',data:kd.D.slice(-last),symbol:'none',lineStyle:{width:1.5,color:'#4d7cfe'}},{name:'J',type:'line',data:kd.J.slice(-last),symbol:'none',lineStyle:{width:1.5,color:'#ec4899'}}]});
}
function renderFundChart(elId, history){
  const dates=history.map(x=>x.date.slice(5));
  const main=history.map(x=>+(x.mainNet/1e4).toFixed(1));
  initChart(elId,{backgroundColor:'transparent',tooltip:{trigger:'axis'},grid:{left:46,right:14,top:14,bottom:24,containLabel:true},xAxis:{type:'category',data:dates,...baseAxis},yAxis:{type:'value',...baseAxis,...baseSplit},series:[{type:'bar',data:main.map(v=>({value:v,itemStyle:{color:v>=0?CH.up:CH.down}}))}]});
}
function renderFinChart(elId, income){
  const dates=income.map(x=>x.date.slice(0,7)).reverse();
  const rev=income.map(x=>+(x.revenue/1e8).toFixed(2)).reverse();
  const profit=income.map(x=>+(x.netProfit/1e8).toFixed(2)).reverse();
  initChart(elId,{backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{data:['营收(亿)','净利(亿)'],textStyle:{color:CH.text,fontSize:10},top:0},grid:{left:46,right:14,top:28,bottom:24,containLabel:true},xAxis:{type:'category',data:dates,...baseAxis},yAxis:{type:'value',...baseAxis,...baseSplit},series:[{name:'营收(亿)',type:'bar',barWidth:'32%',data:rev,itemStyle:{color:CH.accent,borderRadius:[4,4,0,0]}},{name:'净利(亿)',type:'bar',barWidth:'32%',data:profit,itemStyle:{color:CH.up,borderRadius:[4,4,0,0]}}]});

function renderPeerChart(elId, peer, selfNum){
  const names=peer.slice(0,12).map(p=>p.name+(p.code===selfNum?'⭐':''));
  const pe=peer.slice(0,12).map(p=>p.pe>0?p.pe:0);
  initChart(elId,{backgroundColor:'transparent',tooltip:{trigger:'axis'},grid:{left:36,right:14,top:14,bottom:44,containLabel:true},xAxis:{type:'category',data:names,...baseAxis,axisLabel:{color:CH.muted,fontSize:9,rotate:35}},yAxis:{type:'value',...baseAxis,...baseSplit},series:[{type:'bar',barWidth:'55%',data:pe.map((v,i)=>({value:v,itemStyle:{color:peer[i].code===selfNum?CH.gold:CH.accent,borderRadius:[3,3,0,0]}}))}]});
}
function renderMinuteChart(elId, trends, preClose){
  const dates=trends.map(t=>t.time.slice(-5));
  const prices=trends.map(t=>t.close);
  const avg=trends.map(t=>t.avg||t.close);
  const pct=(v)=>((v-preClose)/preClose*100);
  initChart(elId,{backgroundColor:'transparent',tooltip:{trigger:'axis'},legend:{data:['价格','均价'],textStyle:{color:CH.text,fontSize:10},top:0},grid:{left:46,right:14,top:28,bottom:24,containLabel:true},xAxis:{type:'category',data:dates,...baseAxis,axisLabel:{color:CH.muted,fontSize:9,interval:Math.floor(dates.length/6)}},yAxis:{type:'value',scale:true,...baseAxis,...baseSplit,axisLabel:{color:CH.muted,fontSize:10,formatter:v=>pct(v).toFixed(2)+'%'}},series:[{name:'价格',type:'line',data:prices,symbol:'none',lineStyle:{width:1.5,color:CH.accent},areaStyle:{color:'rgba(77,124,254,.12)'}},{name:'均价',type:'line',data:avg,symbol:'none',lineStyle:{width:1,color:CH.gold,type:'dashed'}}]});
}

    const isLimit=lp>0&&d.price>=lp-0.01?1:0;

    <div class="op-item"><span class="k">ATR</span><span class="v">${fmt(a)}</span></div>

</div>`:''}
${bars.length?`<div class="section"><div class="section-t">📈 K线 & 均线</div><div class="chart-box lg" id="ch-dec-kline"></div></div>`:''}
${bars.length?`<div class="section"><div class="section-t">📊 MACD</div><div class="chart-box sm" id="ch-dec-macd"></div></div>`:''}
${bars.length?`<div class="section"><div class="section-t">📉 KDJ</div><div class="chart-box sm" id="ch-dec-kdj"></div></div>`:''}
${minTrends.length?`<div class="section"><div class="section-t">⏱️ 分时走势</div><div class="chart-box sm" id="ch-dec-min"></div></div>`:''}`;
    setTimeout(()=>{

    },50);
  } else if(tab==='fund'){
    cont.innerHTML=`
${fundFlow?`<div class="section"><div class="section-t">💰 今日资金流</div>
  <div style="display:flex;height:26px;border-radius:5px;overflow:hidden;font-size:10px">
    <div style="flex:1;background:${fundFlow.superNet>=0?'#00d68f':'#ff4757'};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">超大${fmtW(fundFlow.superNet)}</div>
    <div style="flex:1;background:${fundFlow.bigNet>=0?'#4d7cfe':'#e63946'};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">大单${fmtW(fundFlow.bigNet)}</div>
    <div style="flex:1;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700">中小${fmtW(fundFlow.midNet+fundFlow.smallNet)}</div>
  </div>
</div>`:''}
${fundHistory.length?`<div class="section"><div class="section-t">📊 近10日主力净额</div><div class="chart-box sm" id="ch-dec-fund"></div></div>`:''}
${l2Trades.length?(()=>{let b=0,s=0;for(const t of l2Trades){if(t.dir==='buy')b+=t.amount;else if(t.dir==='sell')s+=t.amount;}return `<div class="section"><div class="section-t">⚡ L2逐笔</div><div style="display:flex;gap:6px"><span class="tag buy">买 ${fmtW(b)}</span><span class="tag sell">卖 ${fmtW(s)}</span></div></div>`;})():''}
${dragonTiger.length?`<div class="section"><div class="section-t">🐉 龙虎榜</div>
  ${dragonTiger.slice(0,3).map(x=>`<div style="padding:6px 0;border-bottom:1px solid rgba(37,44,66,.4);font-size:11px"><div style="color:var(--text2)">${x.date} · ${esc(x.reason).slice(0,20)}</div><div style="margin-top:3px"><span class="tag buy">买${fmtW(x.buy)}</span> <span class="tag sell">卖${fmtW(x.sell)}</span> <span class="tag ${x.net>=0?'buy':'sell'}">净${fmtW(x.net)}</span></div></div>`).join('')}
</div>`:''}`;
    setTimeout(()=>{if(fundHistory.length)renderFundChart('ch-dec-fund',fundHistory);},50);
  } else if(tab==='fin'){
    cont.innerHTML=`
${info?`<div class="section"><div class="section-t">📊 基本面</div>
  <div class="ic-grid" style="grid-template-columns:repeat(3,1fr)">
    <div><span class="k">市值</span><span class="v">${fmtW(info.totalMv)}</span></div>
    <div><span class="k">PE</span><span class="v">${fmt(info.peTtm,1)}</span></div>

${inc0.revenue?`<div class="section"><div class="section-t">📈 最新业绩</div>
  <div class="op-grid">
    <div class="op-item"><span class="k">营收</span><span class="v">${fmtW(inc0.revenue)}</span></div>
    <div class="op-item"><span class="k">净利</span><span class="v ${inc0.netProfit>=0?'pos':'neg'}">${fmtW(inc0.netProfit)}</span></div>
    <div class="op-item"><span class="k">营收同比</span><span class="v ${inc0.revenueYoy>=0?'pos':'neg'}">${inc0.revenueYoy>=0?'+':''}${fmt(inc0.revenueYoy)}%</span></div>
    <div class="op-item"><span class="k">净利同比</span><span class="v ${inc0.profitYoy>=0?'pos':'neg'}">${inc0.profitYoy>=0?'+':''}${fmt(inc0.profitYoy)}%</span></div>

${reports.length?`<div class="section"><div class="section-t">📝 券商研报</div>${reports.slice(0,4).map(r=>`<div style="font-size:11px;padding:4px 0;color:var(--text2);border-bottom:1px solid rgba(37,44,66,.3)">· ${esc(r.title)}（${esc(r.orgName)} · ${esc(r.rating||'—')}）</div>`).join('')}</div>`:''}`;

window.showDecision=showDecision;
async function copyText(t){try{if(navigator.clipboard)await navigator.clipboard.writeText(t);else{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}showCopyTip('✅ 已复制');}catch(e){showCopyTip('复制失败',true);}}
window.copyText=copyText;

/* ============ 9. 实时快讯 ============ */
LOADERS.news=()=>{
  const el=$('p-news');disposePanel('p-news');
  el.innerHTML=`<div class="card"><div class="card-title"><span>📰 实时快讯</span><button class="btn small ghost" id="nw-load">🔄 刷新</button></div><div id="nw-list"><div class="empty">点击"🔄 刷新"获取最新快讯</div></div></div>`;
  $('nw-load').addEventListener('click', async ()=>{
    const list=$('nw-list');
    list.innerHTML='<div class="empty">加载中…（多源重试）</div>';
    setBadge('快讯加载中','warn');
    const sources = [
      async () => {const url = `https://np-weblist.eastmoney.com/comm/web/getFastNewsList?client=web&biz=web_724&fastColumn=102&sortEnd=&pageSize=40&_=${Date.now()}`;const j = await jsonp(url, 'cb', 8000);if (j && j.data && j.data.fastNewsList) return j.data.fastNewsList;throw new Error('源1');},
      async () => {const url = `https://np-weblist.eastmoney.com/comm/web/getFastNewsList?client=web&biz=web_724&fastColumn=102&sortEnd=&pageSize=40`;const j = await fetchWithProxy(url, 12000).catch(()=>null);if (j && j.data && j.data.fastNewsList) return j.data.fastNewsList;throw new Error('源2');},
      async () => {const url = `https://www.cls.cn/nodeapi/updateTelegraphList?app=CailianpressWeb&os=web&sv=7.7.5&_=${Date.now()}`;const j = await fetchWithProxy(url, 12000).catch(()=>null);if (j && j.data && j.data.roll_data) return j.data.roll_data.map(it=>({title:it.title||it.content||'',summary:it.content||it.title||'',showTime:it.ctime?new Date(it.ctime*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}));throw new Error('源3');},
      async () => {const url = `https://zhibo.sina.com.cn/api/zhibo/feed?page=1&page_size=30&zhibo_id=152&tag_id=0&dire=f&dpc=1&_=${Date.now()}`;const j = await fetchWithProxy(url, 12000).catch(()=>null);if (j && j.result && j.result.data && j.result.data.feed && j.result.data.feed.list) return j.result.data.feed.list.map(it=>({title:it.rich_text||it.text||'',summary:it.rich_text||it.text||'',showTime:it.create_time?it.create_time.slice(-5):''}));throw new Error('源4');}
    ];
    let items = null, usedSrc = '';
    for (let i = 0; i < sources.length; i++) {try {items = await sources[i]();if (items && items.length) {usedSrc = ['东财','东财代理','财联社','新浪'][i];break;}} catch(e) {}}
    if (!items || !items.length) {setBadge('快讯失败','err');list.innerHTML=`<div class="empty">快讯接口暂时不可用<br><button class="btn small ghost" style="margin-top:12px" onclick="document.getElementById('nw-load').click()">🔄 重试</button></div>`;return;}
    setBadge('快讯·'+usedSrc, 'ok');
    const focusCount = items.filter(it => /重磅|突发|紧急|央行|证监会|降准|降息/.test((it.title||'') + (it.summary||''))).length;
    list.innerHTML = `<div class="metrics" style="grid-template-columns:repeat(2,1fr);margin-bottom:10px">
      <div class="metric mini"><div class="l">快讯条数</div><div class="v">${items.length}</div></div>
      <div class="metric mini"><div class="l">重点快讯</div><div class="v" style="color:var(--gold)">${focusCount}</div></div>
    </div>` + items.map(it => {
      const focus = /重磅|突发|紧急|央行|证监会|降准|降息/.test((it.title||'') + (it.summary||''));
      const time = (it.showTime||'').slice(-5) || '--:--';
      const text = it.summary || it.title || '';
      return `<div style="padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:10px">
        <span style="color:var(--muted);font-size:11px;font-family:monospace;flex-shrink:0;width:44px">${time}</span>
        <div style="flex:1;font-size:12px;line-height:1.7;color:${focus?'var(--text)':'var(--text2)'}">${focus?'<span class="tag warn">🔥 重点</span> ':''}${esc(text)}</div>
      </div>`;
    }).join('');
  });
};

/* ============ 全局事件 ============ */
document.addEventListener('click',e=>{
  const star=e.target.closest('[data-star]');
  if(star){e.preventDefault();e.stopPropagation();const code=star.dataset.star;const name=(e.target.closest('[data-code]')||{}).querySelector?.('.ic-name')?.textContent||NAMES[code]||'';const added=toggleWatch(code,name);refreshStars();toast(added?'⭐ 已加入自选':'已移出自选',added?'ok':'');const wp=$('p-watch');if(wp&&wp.classList.contains('active'))renderWatchList();return;}
  const dec=e.target.closest('[data-dec]');
  if(dec){e.preventDefault();e.stopPropagation();showDecision(dec.dataset.dec);return;}
  const rmW=e.target.closest('[data-rm-watch]');
  if(rmW){e.preventDefault();e.stopPropagation();toggleWatch(rmW.dataset.rmWatch);refreshStars();renderWatchList();toast('已移出自选','');return;}
  const rmP=e.target.closest('[data-rm-pos]');
  if(rmP){e.preventDefault();e.stopPropagation();if(confirm('确认删除该持仓？')){const i=State.positions.findIndex(p=>p.code===rmP.dataset.rmPos);if(i>=0){State.positions.splice(i,1);State.save();LOADERS.positions();toast('已删除','');}}return;}
  const item=e.target.closest('[data-code]');
  if(item&&!e.target.closest('button,.star,[data-dec],[data-rm-watch],[data-rm-pos]')){const code=item.dataset.code;if(code&&/^(sh|sz|bj)\d/.test(code))showDecision(code);}
},true);
document.querySelectorAll('#mnav .nav-item[data-nav]').forEach(b=>{b.addEventListener('click',()=>switchTab(b.dataset.nav));});
$('moreBtn').addEventListener('click',openDrawer);
$('highWinToggle').addEventListener('change',e=>{_highWinMode=e.target.checked;toast(_highWinMode?'🎯 已开启高胜率':'已关闭',_highWinMode?'ok':'');});

renderTabs();renderPanels();renderDrawer();LOADERS.sentiment();
setTimeout(async()=>{try{await getSentiment();}catch(e){}},500);
window.addEventListener('error',e=>console.error('[错误]',e.message));
window.addEventListener('unhandledrejection',e=>console.error('[Promise]',e.reason));
</script>
